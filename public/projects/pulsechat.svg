<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-chat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-chat)"/>

  <!-- Window Frame -->
  <rect x="35" y="30" width="730" height="390" rx="8" fill="#0f121b" stroke="rgba(255,255,255,0.1)"/>

  <!-- Header -->
  <rect x="35" y="30" width="730" height="40" rx="8" fill="#141824"/>
  <rect x="35" y="65" width="730" height="5" fill="#141824"/>
  <circle cx="58" cy="50" r="4" fill="#22c55e"/>
  <text x="75" y="54" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">PULSE_CHAT // WEBSOCKET CLIENT (WS://LOCAL:8080)</text>
  <rect x="625" y="40" width="120" height="20" rx="3" fill="#182030"/>
  <text x="635" y="54" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">● CONNECTED</text>

  <!-- Left: Channels Sidebar -->
  <rect x="55" y="85" width="180" height="315" rx="4" fill="#111520" stroke="rgba(255,255,255,0.06)"/>
  <text x="70" y="112" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ROOM CHANNELS</text>
  <line x1="70" y1="122" x2="220" y2="122" stroke="rgba(255,255,255,0.06)"/>

  <rect x="65" y="132" width="160" height="28" rx="3" fill="#182236"/>
  <text x="75" y="150" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold"># general</text>
  <circle cx="210" cy="146" r="3" fill="#22c55e"/>

  <text x="75" y="185" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10"># dev-discussion</text>
  <text x="75" y="215" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10"># project-updates</text>
  <text x="75" y="245" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10"># random</text>

  <text x="70" y="295" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ONLINE USERS (4)</text>
  <text x="75" y="325" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">● Alex (You)</text>
  <text x="75" y="348" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">● Sarah Chen</text>
  <text x="75" y="371" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">● David K.</text>

  <!-- Right: Chat Messages Stream -->
  <rect x="250" y="85" width="495" height="315" rx="4" fill="#111520" stroke="rgba(255,255,255,0.06)"/>

  <!-- Message 1 -->
  <circle cx="280" cy="120" r="14" fill="#1e2538"/>
  <text x="274" y="124" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">SC</text>
  <text x="305" y="115" fill="#f3f4f6" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Sarah Chen</text>
  <text x="375" y="115" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">10:42 AM</text>
  <rect x="305" y="125" width="280" height="32" rx="4" fill="#161c2b"/>
  <text x="315" y="145" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11">Did you inspect the WebSocket handshake?</text>

  <!-- Message 2 (Self) -->
  <circle cx="715" cy="180" r="14" fill="#38bdf8"/>
  <text x="709" y="184" fill="#090a0f" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ME</text>
  <rect x="420" y="170" width="275" height="42" rx="4" fill="#182740" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="430" y="190" fill="#f3f4f6" font-family="Inter, sans-serif" font-size="11">Yes! Reconnection backoff logic is ready.</text>
  <text x="430" y="204" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">ACK: 200 (14ms RTT)</text>

  <!-- Message 3 -->
  <circle cx="280" cy="245" r="14" fill="#1e2538"/>
  <text x="274" y="249" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">DK</text>
  <text x="305" y="240" fill="#f3f4f6" font-family="Inter, sans-serif" font-size="11" font-weight="bold">David K.</text>
  <text x="365" y="240" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">10:45 AM</text>
  <rect x="305" y="250" width="310" height="32" rx="4" fill="#161c2b"/>
  <text x="315" y="270" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11">The typing indicator event fires cleanly now.</text>

  <!-- Typing Status & Input Area -->
  <text x="270" y="325" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Sarah Chen is typing...</text>

  <rect x="265" y="340" width="465" height="42" rx="4" fill="#0a0d14" stroke="rgba(255,255,255,0.1)"/>
  <text x="280" y="365" fill="#6b7280" font-family="Inter, sans-serif" font-size="11">Type your message in #general and press Enter...</text>
  <rect x="675" y="348" width="45" height="26" rx="3" fill="#38bdf8"/>
  <text x="686" y="365" fill="#090a0f" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">SEND</text>
</svg>
