  <text x="320" y="150" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">[PHOTO]</text>
  <text x="275" y="195" fill="#f3f4f6" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Studio Headphones</text>
  <text x="275" y="212" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">$129.00</text>
  <rect x="365" y="200" width="35" height="18" rx="2" fill="#38bdf8"/>
  <text x="373" y="213" fill="#090a0f" font-family="Inter, sans-serif" font-size="9" font-weight="bold">+ADD</text>

  <!-- Product 2 -->
  <rect x="425" y="105" width="145" height="135" rx="4" fill="#161b28" stroke="rgba(255,255,255,0.08)"/>
  <rect x="435" y="115" width="125" height="60" rx="3" fill="#1f2538"/>
  <text x="480" y="150" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">[PHOTO]</text>
  <text x="435" y="195" fill="#f3f4f6" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Mechanical Board</text>
  <text x="435" y="212" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">$89.00</text>
  <rect x="525" y="200" width="35" height="18" rx="2" fill="#38bdf8"/>
  <text x="533" y="213" fill="#090a0f" font-family="Inter, sans-serif" font-size="9" font-weight="bold">+ADD</text>

  <!-- Product 3 -->
  <rect x="585" y="105" width="145" height="135" rx="4" fill="#161b28" stroke="rgba(255,255,255,0.08)"/>
  <rect x="595" y="115" width="125" height="60" rx="3" fill="#1f2538"/>
  <text x="640" y="150" fill="#6b7280" font-family="'JetBrains Mono', monospace" font-size="9">[PHOTO]</text>
  <text x="595" y="195" fill="#f3f4f6" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Desk Mat XL</text>
  <text x="595" y="212" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">$34.00</text>
  <rect x="685" y="200" width="35" height="18" rx="2" fill="#38bdf8"/>
  <text x="693" y="213" fill="#090a0f" font-family="Inter, sans-serif" font-size="9" font-weight="bold">+ADD</text>

  <!-- Bottom Notification Bar -->
  <rect x="265" y="260" width="465" height="120" rx="4" fill="#141824" stroke="rgba(255,255,255,0.06)"/>
  <text x="285" y="285" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ACCESSIBILITY CHECKLIST // WCAG 2.1 AA</text>
  <text x="285" y="310" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">✓ Visible focus indicators on all interactive elements</text>
  <text x="285" y="330" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">✓ Keyboard drawer trap with Escape key dismissal</text>
  <text x="285" y="350" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10">✓ Screen reader aria-live announcements for cart mutations</text>
</svg>
